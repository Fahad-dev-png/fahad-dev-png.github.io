<!--هذا عرض فقط بشكل رسم اذا قدمو العملاء على الوظايف -->

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تم إرسال طلبك بنجاح | وظيفتك بلمستنا</title>
    <style>
        /* تنسيق عام للصفحة والخلفية المتدرجة */
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #1f1c2c, #928dab); 
            color: #fff;
            text-align: center; 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* تنسيق بطاقة العرض بتأثير الزجاج المطمش (Glassmorphism) */
        .card { 
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 650px; 
            width: 100%;
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); 
        }

        h1 { color: #4cd137; margin-bottom: 10px; font-size: 28px; }
        p { color: #f5f6fa; font-size: 16px; line-height: 1.6; margin-bottom: 25px; }
        
        /* حاوية المجسم ثلاثي الأبعاد والعمق البصري */
        .scene3d {
            width: 100%;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px; /* يعطي إيحاء العمق والأبعاد الثلاثية */
            margin-bottom: 25px;
        }

        /* هيكل المكعب الذي سيتحرك في الأبعاد الثلاثة */
        .cube {
            width: 100px;
            height: 100px;
            position: relative;
            transform-style: preserve-3d; /* يحافظ على أبعاد العناصر بداخله كـ 3D */
            animation: rotateCube 8s infinite linear; /* حركة دوران مستمرة وناعمة */
        }

        /* تنسيق وجوه المكعب الستة المشتركة */
        .cube-face {
            position: absolute;
            width: 100px;
            height: 100px;
            background: rgba(76, 209, 55, 0.15);
            border: 2px solid #4cd137;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 0 20px rgba(76, 209, 55, 0.3);
        }

        /* توزيع الوجوه في الفراغ ثلاثي الأبعاد (Z, Y, X) لتشكيل المكعب */
        .cube-face-front  { transform: translateZ(50px); }
        .cube-face-back   { transform: rotateY(180deg) translateZ(50px); }
        .cube-face-right  { transform: rotateY(90deg) translateZ(50px); }
        .cube-face-left   { transform: rotateY(-90deg) translateZ(50px); }
        .cube-face-top    { transform: rotateX(90deg) translateZ(50px); }
        .cube-face-bottom { transform: rotateX(-90deg) translateZ(50px); }

        /* حركة الدوران المستمرة للمكعب بزوايا كاملة */
        @keyframes rotateCube {
            0% { transform: rotateX(0deg) rotateY(0deg); }
            100% { transform: rotateX(360deg) rotateY(360deg); }
        }

        /* تنسيق زر الرجوع للصفحة الرئيسية مع تأثيرات التفاعل */
        .back-btn { 
            display: inline-block; 
            padding: 15px 40px; 
            text-decoration: none; 
            border-radius: 50px; 
            font-weight: bold; 
            color: white; 
            background: #e84118; 
            transition: all 0.4s ease; /* نعومة الحركة عند التفاعل */
            box-shadow: 0 5px 15px rgba(232, 65, 24, 0.4);
            font-size: 16px;
        }
        
        /* تأثير التكبير والظل عند المرور بالماوس فوق الزر */
        .back-btn:hover { 
            background: #c23616; 
            transform: scale(1.08); 
            box-shadow: 0 8px 20px rgba(232, 65, 24, 0.6); 
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- رسالة نجاح الإرسال -->
        <h1>تم استلام سيرتك الذاتية بنجاح!</h1>
        <p>شكراً لثقتك بـ "وظيفتك بلمستنا". تم إرسال ملفك وبياناتك مباشرة إلى النظام، فالك التوفيث.</p>
        
        <!-- قسم عرض المكعب المتحرك ثلاثي الأبعاد -->
        <div class="scene3d">
            <div class="cube">
                <!-- الوجوه الستة للمكعب وتحتوي على رموز تعبيرية تفاعلية -->
                <div class="cube-face cube-face-front">📄</div>
                <div class="cube-face cube-face-back">✨</div>
                <div class="cube-face cube-face-right">✅</div>
                <div class="cube-face cube-face-left">💼</div>
                <div class="cube-face cube-face-top">🚀</div>
                <div class="cube-face cube-face-bottom">⭐</div>
            </div>
        </div>

        <!-- زر الانتقال للعودة للصفحة الرئيسية للموقع -->
        <a href="index.html" class="back-btn">الرجوع للرئيسية</a>
    </div>

</body>
