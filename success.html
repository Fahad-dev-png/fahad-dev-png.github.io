<!--هذا عرض فقط بشكل رسم اذا قدمو العملاء على الوظايف -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تم إرسال طلبك بنجاح | وظيفتك بلمستنا</title>
    <style>
        /* تنسيق عام مع خلفية متدرجة فخمة وأنيميشن هادئ للإضاءة */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042); 
            background-size: 300% 300%;
            animation: gradientBG 12s ease infinite;
            color: #fff;
            text-align: center; 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* بطاقة الزجاج المطور (Glassmorphism) مع حدود متوهجة خفيفة */
        .card { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            max-width: 650px; 
            width: 100%;
            padding: 50px 30px; 
            border-radius: 24px; 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2); 
            transform: translateY(0);
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* عنوان رئيسي براق وملفت */
        h1 { 
            color: #4ade80; 
            margin-bottom: 15px; 
            font-size: 32px; 
            font-weight: 800;
            text-shadow: 0 0 20px rgba(74, 222, 128, 0.4);
        }

        /* نص التوضيح بمرونة عالية */
        p { 
            color: #cbd5e1; 
            font-size: 17px; 
            line-height: 1.8; 
            margin-bottom: 35px; 
        }
        
        /* حاوية المكعب ثلاثي الأبعاد */
        .scene3d {
            width: 100%;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            margin-bottom: 35px;
        }

        /* هيكل المكعب المتحرك */
        .cube {
            width: 110px;
            height: 110px;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateCube 9s infinite linear;
        }

        /* وجوه المكعب بتصميم زجاجي متوهج */
        .cube-face {
            position: absolute;
            width: 110px;
            height: 110px;
            background: rgba(74, 222, 128, 0.1);
            border: 2px solid rgba(74, 222, 128, 0.6);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            box-shadow: 0 0 25px rgba(74, 222, 128, 0.25);
            backdrop-filter: blur(4px);
        }

        /* توزيع الأبعاد الثلاثية للمكعب */
        .cube-face-front  { transform: translateZ(55px); }
        .cube-face-back   { transform: rotateY(180deg) translateZ(55px); }
        .cube-face-right  { transform: rotateY(90deg) translateZ(55px); }
        .cube-face-left   { transform: rotateY(-90deg) translateZ(55px); }
        .cube-face-top    { transform: rotateX(90deg) translateZ(55px); }
        .cube-face-bottom { transform: rotateX(-90deg) translateZ(55px); }

        /* حركة الدوران المستمرة للمكعب */
        @keyframes rotateCube {
            0% { transform: rotateX(0deg) rotateY(0deg); }
            100% { transform: rotateX(360deg) rotateY(360deg); }
        }

        /* زر الرجوع الفخم بتدرج لوني وتأثير حركي ناعم */
        .back-btn { 
            display: inline-block; 
            padding: 16px 45px; 
            text-decoration: none; 
            border-radius: 50px; 
            font-weight: 700; 
            color: white; 
            background: linear-gradient(135deg, #f43f5e, #e11d48); 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            box-shadow: 0 10px 25px rgba(225, 29, 72, 0.4);
            font-size: 17px;
            letter-spacing: 0.5px;
        }
        
        /* تأثير التفاعل عند تمرير الماوس */
        .back-btn:hover { 
            transform: translateY(-3px) scale(1.05); 
            box-shadow: 0 15px 30px rgba(225, 29, 72, 0.6); 
            background: linear-gradient(135deg, #fb7185, #f43f5e);
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- رسالة نجاح الإرسال -->
        <h1>تم استلام سيرتك الذاتية بنجاح!</h1>
        <p>شكراً لثقتك بـ <strong>"وظيفتك بلمستنا"</strong>. تم نقل ملفك وبياناتك الاحترافية إلى النظام فوراً، وفالك التوفيق في مسيرتك المهنية.</p>
        
        <!-- قسم المكعب المتحرك ثلاثي الأبعاد -->
        <div class="scene3d">
            <div class="cube">
                <div class="cube-face cube-face-front">📄</div>
                <div class="cube-face cube-face-back">✨</div>
                <div class="cube-face cube-face-right">✅</div>
                <div class="cube-face cube-face-left">💼</div>
                <div class="cube-face cube-face-top">🚀</div>
                <div class="cube-face cube-face-bottom">⭐</div>
            </div>
        </div>

        <!-- زر العودة للرئيسية -->
        <a href="index.html" class="back-btn">الرجوع للرئيسية</a>
    </div>

</body>
</html>
